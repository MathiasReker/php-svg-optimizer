name: Feature request
description: Suggest a new rule or another improvement.
labels: [enhancement]
assignees: [MathiasReker]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: For a new rule, include an example SVG before and after.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
