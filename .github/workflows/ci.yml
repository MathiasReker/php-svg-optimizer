name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '8.3', '8.4', '8.5', '8.6' ]
        include:
          - operating-system: 'windows-latest'
            php-versions: '8.5'
    name: PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          coverage: ${{ (matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest') && 'xdebug' || 'none' }}

      - name: Show the PHP version
        run: php -v

      - name: Update Composer
        run: composer self-update

      - name: Find the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-versions }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-versions }}-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php-versions }}" == "8.6" ]]; then
            composer install --optimize-autoloader --ignore-platform-req=php+
          else
            composer install --optimize-autoloader
          fi

      - name: Check composer.json is valid
        run: composer check:composer-validate

      - name: Check platform requirements
        if: matrix.php-versions != '8.6'
        run: composer check:platform

      - name: Check PSR-4 autoloading
        run: composer check:autoload

      - name: Run tests with coverage
        if: matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest'
        run: composer test -- --coverage-clover=coverage.xml

      - name: Run tests
        if: matrix.php-versions != '8.3' || matrix.operating-system != 'ubuntu-latest'
        run: composer test

      - name: Check code style
        if: matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest'
        run: composer check:php-cs-fixer

      - name: Check PHPStan
        run: composer check:phpstan

      - name: Check Rector
        run: composer check:rector

      - name: Audit dependencies
        run: composer check:audit

      - name: Check composer.json is normalized
        run: composer check:composer-normalize
