name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - '*'

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '8.3', '8.4' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          coverage: xdebug

      - name: Display PHP Version
        run: php -v

      - name: Update Composer to Latest Version
        run: composer self-update

      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Check platform requirements for packages
        run: composer check

      - name: Analyze Composer Dependencies
        run: composer composer-dependency-analyser

      - name: Lint PHP Files
        run: |
          find src tests -name '*.php' -exec php -l {} \;

      - name: Run Tests and Generate Coverage Report
        run: |
          composer test -- --coverage-clover=coverage.xml
          cat coverage.xml

      - name: Check Code Style with PHP CS Fixer
        run: |
          if [[ "${{ matrix.php-versions }}" != "8.4" ]]; then
            composer cs-check
          fi

      - name: Analyze Code with PHPStan
        run: vendor/bin/phpstan analyse --level=max --error-format=table --memory-limit=1G

      - name: Perform Composer Security Audit
        run: composer audit --format=table

      - name: Normalize Composer Configuration
        run: composer normalize --dry-run --no-check-lock

      - name: Extract coverage percentage
        id: extract
        run: |
          FRACTION=$(./vendor/bin/phpunit --coverage-text | grep 'Lines:' | head -1 | awk '{print $3}')
          PERCENT=$(echo "scale=2; 100 * $FRACTION" | bc)
          echo "percent=$(printf "%.0f" $PERCENT)" >> $GITHUB_OUTPUT

      - name: Generate and push coverage badge
        if: github.ref == 'refs/heads/develop'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git checkout develop
          git reset --hard origin/develop

          mkdir -p dev/artifacts

          PERCENT=${{ steps.extract.outputs.percent }}
          COLOR=red
          if (( PERCENT >= 80 )); then COLOR=green;
          elif (( PERCENT >= 50 )); then COLOR=yellow;
          fi

          curl -s -o dev/artifacts/coverage.svg.new "https://badgen.net/badge/coverage/${PERCENT}%25/${COLOR}"

          # Only replace coverage.svg if the content has changed
          if ! cmp -s dev/artifacts/coverage.svg.new dev/artifacts/coverage.svg; then
            mv dev/artifacts/coverage.svg.new dev/artifacts/coverage.svg
            git add dev/artifacts/coverage.svg
            git commit -m "Update coverage badge to ${PERCENT}%"
            git push origin develop
          else
            echo "Coverage badge unchanged. Skipping commit."
          fi
