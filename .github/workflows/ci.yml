name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop

  pull_request:

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '8.3', '8.4', '8.5', '8.6' ]
        include:
          - operating-system: 'windows-latest'
            php-versions: '8.5'
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          coverage: ${{ (matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest') && 'xdebug' || 'none' }}

      - name: Display PHP Version
        run: php -v

      - name: Update Composer to Latest Version
        run: composer self-update

      - name: Install Composer Dependencies
        run: |
          if [[ "${{ matrix.php-versions }}" == "8.6" ]]; then
            composer install --optimize-autoloader --ignore-platform-req=php+
          else
            composer install --optimize-autoloader
          fi

      - name: Validate Composer Configuration
        run: composer analyze:validate

      - name: Check platform requirements for packages
        if: matrix.php-versions != '8.6'
        run: composer analyze:check

      - name: Check PSR-4 autoloading
        run: composer analyze:autoload

      - name: Run Tests and Generate Coverage Report
        if: matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest'
        run: composer test -- --coverage-clover=coverage.xml

      - name: Run Tests
        if: matrix.php-versions != '8.3' || matrix.operating-system != 'ubuntu-latest'
        run: composer test

      - name: Check Code Style with PHP CS Fixer
        if: matrix.php-versions == '8.3' && matrix.operating-system == 'ubuntu-latest'
        run: composer analyze:php-cs-fixer

      - name: Analyze Code with PHPStan
        run: composer analyze:phpstan

      - name: Analyze Code with Rector
        run: composer analyze:rector

      - name: Perform Composer Security Audit
        run: composer analyze:audit

      - name: Normalize Composer Configuration
        run: composer analyze:normalize
