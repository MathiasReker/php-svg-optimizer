name: Record terminal demo

on:
  push:
    branches:
      - develop
    paths:
      - 'dev/scripts/record-demo.sh'
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  terminal-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring

      - name: Install Pipe Viewer (pv) and Asciinema
        run: |
          sudo apt-get update
          sudo apt-get install -y pv asciinema
          pv --version
          asciinema --version

      - name: Record the script execution
        run: |
          asciinema rec --command="./dev/scripts/record-demo.sh" --quiet --overwrite demo.cast

      - name: Download the prebuilt `agg` binary for Ubuntu (x86_64)
        run: |
          wget https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu -O agg
          chmod +x agg
          sudo mv agg /usr/local/bin

      - name: Convert Cast to GIF using `agg` binary
        run: |
          agg --theme dracula --font-size 20 demo.cast demo.gif

      - name: Move demo.gif to dev/artifacts folder and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git checkout develop
          git reset --hard origin/develop

          DEMO_GIF_PATH="dev/artifacts/demo.gif"

          mkdir -p dev/artifacts
          if [ -f "$DEMO_GIF_PATH" ]; then
            rm "$DEMO_GIF_PATH"
          fi

          mv demo.gif "$DEMO_GIF_PATH"

          git add "$DEMO_GIF_PATH"

          if git diff --cached --quiet; then
            echo "demo.gif is unchanged"
            exit 0
          fi

          git commit -m "build: update demo.gif"
          git push origin develop
